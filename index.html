<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Neon Input</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Notion Font Stack */
        body {
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Inter", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";

            /* [수정됨] 배경색을 노션 다크 모드 배경색으로 변경 */
            background-color: #191919;

            /* [추가됨] 화면 높이 전체를 채우도록 설정 */
            min-height: 100vh;
            margin: 0;
        }

        /* Animated Gradient Border Container */
        .neon-container {
            position: relative;
            background: #242424; /* 카드는 배경보다 약간 밝게 (구분감 위해) */
            border-radius: 12px;
            z-index: 1;
            /* 테두리 대신 내부 box-shadow로 깊이감 표현 */
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* 화려한 그라데이션 테두리 효과 (가상 요소 사용) */
        .neon-container::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00dbde);
            z-index: -1;
            opacity: 0.7;
            filter: blur(2px);
            transition: opacity 0.3s ease;
        }

        .neon-container:hover::before {
            opacity: 1;
            filter: blur(4px); /* 호버 시 빛 번짐 효과 강화 */
        }

        .notion-header {
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notion-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            transition: all 0.3s ease;
            outline: none;
        }

        .notion-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #a855f7; /* Purple accent */
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); /* Purple Glow */
        }

        .notion-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Gradient Button */
        .neon-btn {
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            color: white;
            font-weight: 600;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .neon-btn:hover {
            background: linear-gradient(90deg, #7c3aed, #2563eb);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .neon-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Scrollbar */
        .notion-input::-webkit-scrollbar {
            width: 4px;
        }
        .notion-input::-webkit-scrollbar-track {
            background: transparent;
        }
        .notion-input::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 2px;
        }
    </style>
</head>
<body class="p-2">

    <div class="neon-container p-4 w-full max-w-full mx-auto">
        <div class="flex justify-between items-center mb-3">
            <div class="notion-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>AI Quick Note</span>
            </div>
            <div id="statusDot" class="w-2 h-2 rounded-full bg-gray-600 transition-colors duration-300"></div>
        </div>

        <textarea id="inputText"
                  class="notion-input h-24 leading-relaxed"
                  placeholder="무엇을 기록할까요? (예: 내일 오후 3시 회의 일정 추가해줘)"></textarea>

        <div class="flex items-center justify-end mt-3 gap-3">
            <span id="statusMsg" class="text-xs font-medium hidden"></span>
            <button id="sendBtn" class="neon-btn px-5 py-2 shadow-lg flex items-center gap-2">
                <span>Save</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // 중요: 본인의 Make.com 웹훅 URL 입력
        const WEBHOOK_URL = "https://hook.eu2.make.com/s7bkugwjp3n4bcvy5csks0li9aphpgpe";

        const input = document.getElementById('inputText');
        const btn = document.getElementById('sendBtn');
        const msg = document.getElementById('statusMsg');
        const dot = document.getElementById('statusDot');

        // Enter 키 처리
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                btn.click();
            }
        });

        btn.addEventListener('click', async () => {
            const text = input.value.trim();
            if (!text) {
                showStatus('내용을 입력해주세요', false);
                shakeInput();
                return;
            }

            // 로딩 상태
            const originalBtnContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            dot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse"; // 처리 중 (노랑)

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (response.ok) {
                    showStatus('저장되었습니다', true);
                    dot.className = "w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.8)]"; // 성공 (초록 Glow)
                    input.value = '';
                    setTimeout(() => {
                        msg.classList.add('hidden');
                        dot.className = "w-2 h-2 rounded-full bg-gray-600"; // 대기 상태 복귀
                    }, 2500);
                } else {
                    throw new Error('서버 오류');
                }
            } catch (error) {
                console.error(error);
                showStatus('전송 실패', false);
                dot.className = "w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]"; // 실패 (빨강 Glow)
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnContent;
            }
        });

        function showStatus(text, isSuccess) {
            msg.innerText = text;
            msg.classList.remove('hidden', 'text-gray-400', 'text-red-400', 'text-green-400');

            if (isSuccess) {
                msg.classList.add('text-green-400');
            } else if (text === '전송 실패' || text === '내용을 입력해주세요') {
                msg.classList.add('text-red-400');
            } else {
                msg.classList.add('text-gray-400');
            }
        }

        function shakeInput() {
            input.classList.add('translate-x-1');
            setTimeout(() => input.classList.remove('translate-x-1'), 100);
            setTimeout(() => input.classList.add('-translate-x-1'), 200);
            setTimeout(() => input.classList.remove('-translate-x-1'), 300);
        }
    </script>
</body>
</html>
